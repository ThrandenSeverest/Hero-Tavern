name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Validate Windows PowerShell scripts
        shell: powershell
        run: |
          $paths = @(Get-ChildItem installer,manager,tests -Filter '*.ps1' -Recurse | Select-Object -ExpandProperty FullName)
          foreach ($path in $paths) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse error: $path"
            }
          }
      - name: Test model verification and profile preservation
        shell: powershell
        run: ./tests/ModelTools.Tests.ps1
      - name: Test fresh SillyTavern profile configuration
        shell: pwsh
        run: node --test tests/feature-recovery.test.cjs tests/qwen-image21.test.cjs tests/qwen-image-reconciliation.test.cjs tests/lora-library.test.cjs tests/writer-prose.test.cjs tests/writer.test.cjs tests/injuries.test.cjs tests/configure.test.cjs tests/bridge.test.cjs tests/reply.test.cjs tests/context.test.cjs tests/images.test.cjs tests/adventure.test.cjs tests/adventure-director.test.cjs tests/adventure-two-stage.test.cjs tests/repair-regressions.test.cjs tests/storage-gallery.test.cjs tests/story.test.cjs tests/thinking.test.cjs tests/models.test.cjs tests/studio.test.cjs tests/comfy.test.cjs tests/comfy-advanced.test.cjs tests/comfy-workflow-library.test.cjs tests/comfy-model-hub.test.cjs tests/assistant.test.cjs tests/engine-runtime.test.cjs tests/installer-manifest.test.cjs tests/image-model-center.test.cjs tests/tts.test.cjs tests/writer-tracker-gguf.test.cjs
      - name: Checkout upstream SillyTavern for browser integration test
        uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: .ci/SillyTavern
      - name: Install integration test dependencies
        shell: pwsh
        run: |
          npm ci --prefix .ci/SillyTavern --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'SillyTavern dependencies failed' }
          npm install --prefix .ci/browser --no-audit --no-fund playwright
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed' }
          node .ci/browser/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed' }
      - name: Test real SillyTavern UI and automatic local engine connection
        shell: pwsh
        run: node tests/ui-smoke.cjs
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hero-Tavern-UI-QA
          include-hidden-files: true
          path: |
            .ci/*-qa.png
            .ci/sillytavern-smoke.log
          if-no-files-found: ignore
      - name: Compile installer and embed published PowerShell script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler not available' }
          & $compiler /nologo /target:exe /platform:x64 /optimize+ "/out:dist\Hero-Tavern-Setup.exe" "/resource:installer\Install.ps1,InstallScript" "/resource:manager\ModelManager.ps1,ModelManagerScript" "/resource:manager\LaunchLocalAI.ps1,LocalAILaunchScript" "/resource:manager\StartHeroTavern.ps1,StartHeroTavern.ps1" "/resource:manager\ModelTools.ps1,ModelTools.ps1" "/resource:manager\models.json,models.json" "/resource:manager\ConfigureTavern.cjs,ConfigureTavern.cjs" "/resource:manager\ModelBridge.cjs,ModelBridge.cjs" "/resource:manager\TTSService.cjs,TTSService.cjs" "/resource:manager\TTSWorker.py,TTSWorker.py" "/resource:manager\VoicePanel.js,VoicePanel.js" "/resource:manager\ModelPanel.html,ModelPanel.html" "/resource:extension\index.js,HeroExtension.js" "/resource:extension\manifest.json,HeroExtension.json" "/resource:manager\ReplyPipeline.cjs,ReplyPipeline.cjs" "/resource:manager\ReplyFilters.cjs,ReplyFilters.cjs" "/resource:manager\ContextMemory.cjs,ContextMemory.cjs" "/resource:manager\ImageService.cjs,ImageService.cjs" "/resource:manager\Adventure.html,Adventure.html" "/resource:manager\AdventureAdapter.js,AdventureAdapter.js" "/resource:manager\spells.json,spells.json" "/resource:manager\AutoTune.cjs,AutoTune.cjs" "/resource:manager\EngineHTTP.cjs,EngineHTTP.cjs" "/resource:manager\Performance.cjs,Performance.cjs" "/resource:manager\ImageStudio.cjs,ImageStudio.cjs" "/resource:manager\AssistantWorkspace.cjs,AssistantWorkspace.cjs" "/resource:manager\AssistantPanel.js,AssistantPanel.js" "/resource:manager\ComfyAdapter.cjs,ComfyAdapter.cjs" "/resource:manager\ComfyWorkflows.cjs,ComfyWorkflows.cjs" "/resource:manager\SceneComposition.cjs,SceneComposition.cjs" "/resource:manager\ComfyWorkflowLibrary.cjs,ComfyWorkflowLibrary.cjs" "/resource:manager\ComfyRuntime.cjs,ComfyRuntime.cjs" "/resource:manager\ComfyModelHub.cjs,ComfyModelHub.cjs" "/resource:manager\ImageModelCenter.cjs,ImageModelCenter.cjs" "/resource:manager\ImageModelCenterUI.js,ImageModelCenterUI.js" "/resource:manager\LoRAManager.cjs,LoRAManager.cjs" "/resource:manager\LoRALibraryUI.js,LoRALibraryUI.js" "/resource:manager\ComfyRecipes.cjs,ComfyRecipes.cjs" "/resource:manager\EngineShutdown.cjs,EngineShutdown.cjs" "/resource:manager\EngineRuntime.cjs,EngineRuntime.cjs" "/resource:manager\DiskCare.cjs,DiskCare.cjs" "/resource:manager\ImageGallery.cjs,ImageGallery.cjs" "/resource:extension\images.js,HeroImages.js" "/resource:manager\ModelProfiles.cjs,ModelProfiles.cjs" "/resource:manager\StoryState.cjs,StoryState.cjs" "/resource:manager\StoryStore.cjs,StoryStore.cjs" "/resource:manager\StoryAPI.cjs,StoryAPI.cjs" "/resource:manager\ThinkingWorker.cjs,ThinkingWorker.cjs" "/resource:manager\StoryPanel.js,StoryPanel.js" "/resource:manager\CreatorPanel.js,CreatorPanel.js" "/resource:extension\story.js,HeroStory.js" "/resource:manager\WriterStore.cjs,WriterStore.cjs" "/resource:manager\WriterContext.cjs,WriterContext.cjs" "/resource:manager\WriterAPI.cjs,WriterAPI.cjs" "/resource:manager\Writer.html,Writer.html" "launcher\Bootstrap.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          Get-FileHash 'dist\Hero-Tavern-Setup.exe' -Algorithm SHA256 | Format-List
      - name: Verify EXE embeds complete startup dependencies
        shell: powershell
        run: |
          $exe = (Resolve-Path 'dist\Hero-Tavern-Setup.exe').Path
          $resources = [System.Reflection.Assembly]::LoadFile($exe).GetManifestResourceNames()
          $manager = Get-ChildItem 'manager' -File | Where-Object { $_.Extension -in @('.cjs','.js','.json','.html','.ps1') }
          foreach ($file in $manager) {
            $expected = switch ($file.Name) {
              'ModelManager.ps1' { 'ModelManagerScript' }
              'LaunchLocalAI.ps1' { 'LocalAILaunchScript' }
              default { $file.Name }
            }
            if ($expected -notin $resources) { throw "Installed EXE is missing required module resource: $expected" }
          }
          Write-Host ("Verified {0} manager assets embedded in the Windows EXE." -f $manager.Count)
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hero-Tavern-Setup-Windows-x64
          path: dist/Hero-Tavern-Setup.exe
          if-no-files-found: error
